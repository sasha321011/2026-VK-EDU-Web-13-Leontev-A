<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AskMe — регистрация</title>
    <link rel="stylesheet" href="static/css/base.css">
    <link rel="stylesheet" href="static/css/forms.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            <a href="index.html">AskMe</a>
        </div>

        <div class="search">
            <form class="search-form">
                <input type="search" class="search-input" placeholder="Поиск...">
                <button type="submit">Найти</button>
            </form>
        </div>

        <div class="user-block">
            <a href="login.html">Войти</a>
            <a href="signup.html">Регистрация</a>
        </div>

    </header>

    <main class="main">
        <div class="container">
            <div class="row">

                <div class="content">
                    <div class="form-wrapper">

                        <h1 class="form-title">Регистрация</h1>

                        <form class="form-card">

                            <div class="form-group">
                                <label for="signup-login">Логин</label>
                                <input type="text" id="signup-login" class="form-input"
                                       placeholder="Ваш логин">
                            </div>

                            <div class="form-group has-error">
                                <label for="signup-email">Email</label>
                                <input type="email" id="signup-email" class="form-input"
                                       placeholder="you@example.com" value="bad-email">
                                <div class="field-error">Вы ввели невалидный email.</div>
                            </div>

                            <div class="form-group">
                                <label for="signup-password">Пароль</label>
                                <input type="password" id="signup-password" class="form-input"
                                       placeholder="Введите пароль">
                                <div class="form-text">Минимум 8 символов.</div>
                            </div>

                            <div class="form-group has-error">
                                <label for="signup-password2">Повторите пароль</label>
                                <input type="password" id="signup-password2" class="form-input"
                                       placeholder="Повторите пароль">
                                <div class="field-error">Пароли не совпадают.</div>
                            </div>

                            <div class="form-group">
                                <label for="signup-avatar">Аватар</label>
                                <input type="file" id="signup-avatar" class="form-input"
                                       accept="image/*">
                            </div>

                            <button type="submit" class="btn-submit">Создать аккаунт</button>

                        </form>

                        <p class="form-footer-link">
                            Уже есть аккаунт? <a href="login.html">Войти</a>
                        </p>

                    </div>
                </div>

                <aside class="sidebar">

                    <div class="widget">
                        <h2 class="widget-title">Популярные теги</h2>
                        <div class="tags">
                            <a href="#" class="tag">python</a>
                            <a href="#" class="tag">django</a>
                            <a href="#" class="tag">html</a>
                            <a href="#" class="tag">css</a>
                            <a href="#" class="tag">javascript</a>
                        </div>
                    </div>

                    <div class="widget">
                        <h2 class="widget-title">Лучшие пользователи</h2>
                        <ul class="members">
                            <li class="member">
                                <img src="static/img/avatar.png" alt="avatar" class="member-avatar">
                                <a href="profile.html">Иван Иванов</a>
                            </li>
                            <li class="member">
                                <img src="static/img/avatar.png" alt="avatar" class="member-avatar">
                                <a href="profile.html">Мария Петрова</a>
                            </li>
                            <li class="member">
                                <img src="static/img/avatar.png" alt="avatar" class="member-avatar">
                                <a href="profile.html">Петр Сидоров</a>
                            </li>
                        </ul>
                    </div>

                </aside>

            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 AskMe. Учебный проект VK Education.</p>
        </div>
    </footer>

</body>

</html>
