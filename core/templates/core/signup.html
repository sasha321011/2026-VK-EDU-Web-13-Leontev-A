{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'core/css/forms.css' %}">
{% endblock %}

{% block content %}
    <div class="form-wrapper">
        <h1 class="form-title">Регистрация</h1>

        <form class="form-card">
            <div class="form-group">
                <label for="signup-login">Логин</label>
                <input type="text" id="signup-login" class="form-input" placeholder="Ваш логин">
            </div>

            <div class="form-group has-error">
                <label for="signup-email">Email</label>
                <input type="email" id="signup-email" class="form-input" placeholder="you@example.com" value="bad-email">
                <div class="field-error">Вы ввели невалидный email.</div>
            </div>

            <div class="form-group">
                <label for="signup-password">Пароль</label>
                <input type="password" id="signup-password" class="form-input" placeholder="Введите пароль">
                <div class="form-text">Минимум 8 символов.</div>
            </div>

            <button type="submit" class="btn-submit">Создать аккаунт</button>
        </form>

        <p class="form-footer-link">
            Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a>
        </p>
    </div>
{% endblock %}
