{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'core/css/forms.css' %}">
{% endblock %}

{% block content %}
    <div class="form-wrapper" style="max-width: 700px;">
        <h1 class="form-title">Задать вопрос</h1>

        <form class="form-card">
            <div class="form-group">
                <label for="ask-title">Заголовок</label>
                <input type="text" id="ask-title" class="form-input" placeholder="Кратко о проблеме" maxlength="150">
                <div class="form-text">Максимум 150 символов.</div>
            </div>

            <div class="form-group">
                <label for="ask-text">Текст вопроса</label>
                <textarea id="ask-text" class="form-input" rows="6" placeholder="Опишите подробно..." maxlength="2000"></textarea>
                <div class="form-text">Максимум 2000 символов.</div>
            </div>

            <div class="form-group">
                <label for="ask-tags">Теги</label>
                <input type="text" id="ask-tags" class="form-input" placeholder="python, django" maxlength="100">
                <div class="form-text">Через запятую, не более 5 тегов.</div>
            </div>

            <button type="submit" class="btn-submit">Опубликовать</button>
        </form>
    </div>
{% endblock %}
