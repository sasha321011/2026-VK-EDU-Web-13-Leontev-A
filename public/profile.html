<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AskMe — профиль</title>
    <link rel="stylesheet" href="static/css/base.css">
    <link rel="stylesheet" href="static/css/forms.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            <a href="index.html">AskMe</a>
        </div>

        <div class="search">
            <form class="search-form">
                <input type="search" class="search-input" placeholder="Поиск...">
                <button type="submit">Найти</button>
            </form>
        </div>

        <div class="user-block">
            <a href="ask.html" class="btn-ask">Задать вопрос</a>
            <a href="profile.html" class="user-profile-link">
                <img src="static/img/avatar.png" alt="avatar" class="profile-avatar">
                <span>Иван</span>
            </a>
            <a href="index.html">log out</a>
        </div>

    </header>

    <main class="main">
        <div class="container">
            <div class="row">

                <div class="content">
                    <div class="form-wrapper">

                        <h1 class="form-title">Настройки профиля</h1>

                        <form class="form-card">

                            <div class="avatar-block">
                                <img src="static/img/avatar.png" alt="avatar" class="avatar-preview">
                                <div class="form-group" style="flex: 1; margin: 0;">
                                    <label for="profile-avatar">Сменить аватар</label>
                                    <input type="file" id="profile-avatar" class="form-input" accept="image/*">
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="profile-login">Логин</label>
                                <input type="text" id="profile-login" class="form-input"
                                       value="ivanov" readonly>
                                <div class="form-text">Логин изменить нельзя.</div>
                            </div>

                            <div class="form-group has-error">
                                <label for="profile-email">Email</label>
                                <input type="email" id="profile-email" class="form-input"
                                       value="bad-email">
                                <div class="field-error">Вы ввели невалидный email.</div>
                            </div>

                            <div class="form-group">
                                <label for="profile-nick">Отображаемое имя</label>
                                <input type="text" id="profile-nick" class="form-input"
                                       value="Иван">
                                <div class="form-text">Максимум 50 символов.</div>
                            </div>

                            <button type="submit" class="btn-submit">Сохранить</button>

                        </form>

                    </div>
                </div>

                <aside class="sidebar">

                    <div class="widget">
                        <h2 class="widget-title">Популярные теги</h2>
                        <div class="tags">
                            <a href="#" class="tag">python</a>
                            <a href="#" class="tag">django</a>
                            <a href="#" class="tag">html</a>
                            <a href="#" class="tag">css</a>
                            <a href="#" class="tag">javascript</a>
                        </div>
                    </div>

                    <div class="widget">
                        <h2 class="widget-title">Лучшие пользователи</h2>
                        <ul class="members">
                            <li class="member">
                                <img src="static/img/avatar.png" alt="avatar" class="member-avatar">
                                <a href="profile.html">Иван Иванов</a>
                            </li>
                            <li class="member">
                                <img src="static/img/avatar.png" alt="avatar" class="member-avatar">
                                <a href="profile.html">Мария Петрова</a>
                            </li>
                            <li class="member">
                                <img src="static/img/avatar.png" alt="avatar" class="member-avatar">
                                <a href="profile.html">Петр Сидоров</a>
                            </li>
                        </ul>
                    </div>

                </aside>

            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 AskMe. Учебный проект VK Education.</p>
        </div>
    </footer>

</body>

</html>
