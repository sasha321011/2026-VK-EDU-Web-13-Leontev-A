{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'core/css/forms.css' %}">
{% endblock %}

{% block content %}
    <div class="form-wrapper">
        <h1 class="form-title">Вход</h1>

        <div class="form-alert">
            Вы ввели неправильный email или пароль.
        </div>

        <form class="form-card">
            <div class="form-group">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" class="form-input" placeholder="you@example.com">
            </div>

            <div class="form-group">
                <label for="login-password">Пароль</label>
                <input type="password" id="login-password" class="form-input" placeholder="Введите пароль">
            </div>

            <button type="submit" class="btn-submit">Войти</button>
        </form>

        <p class="form-footer-link">
            Нет аккаунта? <a href="{% url 'signup' %}">Зарегистрироваться</a>
        </p>
    </div>
{% endblock %}
